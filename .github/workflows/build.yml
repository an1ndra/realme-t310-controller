name: Build Packages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3 python3-pyqt6 python3-dbus python3-devel

      - name: Build RPM
        run: |
          rpmbuild -ba \
            --define "_topdir ${{ github.workspace }}/build" \
            --define "version 0.0.1" \
            --define "release rc" \
            realme-t310-controller.spec

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: |
            build/RPMS/x86_64/*.rpm
            build/SRPMS/*.src.rpm
          retention-days: 30

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dh-make python3-all python3-pyqt6 python3-dbus build-essential

      - name: Build DEB
        run: |
          mkdir -p debian
          cat > debian/changelog << EOF
          realme-t310-controller (0.0.1-rc) unstable; urgency=low
          
            * Initial release
            
           -- an1ndra <anindrakarmakar+git@proton.me>  $(date -R)
          EOF
          cat > debian/control << EOF
          Source: realme-t310-controller
          Section: utils
          Priority: optional
          Maintainer: an1ndra <anindrakarmakar+git@proton.me>
          Build-Depends: debhelper (>= 13), python3-all, python3-pyqt6, python3-dbus
          Standards-Version: 4.6.0
          
          Package: realme-t310-controller
          Architecture: any
          Depends: \${misc:Depends}, \${python3:Depends}
          Description: Qt6 desktop controller for realme Buds T310
           A desktop application to control realme Buds T310 earbuds.
          EOF
          cat > debian/rules << 'EOF'
          #!/usr/bin/make -f
          %:
              dh $@
          
          override_dh_auto_install:
              install -D -m 755 qt_app/realme_t310_controller.py $(CURDIR)/debian/realme-t310-controller/usr/bin/realme-t310-controller
              install -D -m 644 realme-t310-controller.desktop $(CURDIR)/debian/realme-t310-controller/usr/share/applications/realme-t310-controller.desktop
          EOF
          chmod +x debian/rules
          debuild -us -uc -b

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: ../*.deb
          retention-days: 30

  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-dbus desktop-file-utils

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          mkdir -p realme-t310-controller.AppDir/usr/bin
          mkdir -p realme-t310-controller.AppDir/usr/share/applications
          cp qt_app/realme_t310_controller.py realme-t310-controller.AppDir/usr/bin/
          cp realme-t310-controller.desktop realme-t310-controller.AppDir/usr/share/applications/
          
          echo '#!/usr/bin/python3' | cat - realme-t310-controller.AppDir/usr/bin/realme_t310_controller.py > tmp && mv tmp realme-t310-controller.AppDir/usr/bin/realme-t310-controller
          chmod +x realme-t310-controller.AppDir/usr/bin/realme-t310-controller
          
          cat > realme-t310-controller.AppDir/AppRun << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")/usr/bin"
          exec python3 realme_t310_controller.py "$@"
          EOF
          chmod +x realme-t310-controller.AppDir/AppRun
          
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir realme-t310-controller.AppDir --executable usr/bin/realme-t310-controller --desktop-file usr/share/applications/realme-t310-controller.desktop --output appimage

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-packages
          path: '*.AppImage'
          retention-days: 30

  release:
    needs: [build-rpm, build-deb, build-appimage]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 0.0.1-rc
          prerelease: true
          files: |
            'artifacts/rpm-packages/*.rpm'
            'artifacts/deb-packages/*.deb'
            'artifacts/appimage-packages/*.AppImage'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}