name: Build Packages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3

      - name: Build RPM
        run: |
          mkdir -p build/SOURCES
          tar --transform "s,^,realme-t310-controller-0.0.1/," \
              --exclude='__pycache__' \
              -czf build/SOURCES/realme-t310-controller-0.0.1.tar.gz \
              qt_app realme-t310-controller.desktop icons
          rpmbuild -ba \
            --define "_topdir ${{ github.workspace }}/build" \
            --undefine dist \
            --define "release rc" \
            realme-t310-controller.spec

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-packages
          path: |
            build/RPMS/x86_64/*.rpm
            build/SRPMS/*.src.rpm
          retention-days: 30

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dh-make python3-all python3-pyqt6 python3-dbus build-essential

      - name: Build DEB
        run: |
          mkdir -p debian
          cat > debian/changelog << EOF
          realme-t310-controller (0.0.1-rc) unstable; urgency=low

            * Initial release

           -- an1ndra <anindrakarmakar+git@proton.me>  $(date -R)
          EOF
          cat > debian/control << EOF
          Source: realme-t310-controller
          Section: utils
          Priority: optional
          Maintainer: an1ndra <anindrakarmakar+git@proton.me>
          Build-Depends: debhelper-compat (= 13)
          Standards-Version: 4.6.0

          Package: realme-t310-controller
          Architecture: all
          Depends: \${misc:Depends}, python3, python3-pyqt6, python3-dbus
          Description: Qt6 desktop controller for realme Buds T310
           A desktop application to control realme Buds T310 earbuds.
          EOF
          cat > debian/rules << 'EOF'
          #!/usr/bin/make -f
          .RECIPEPREFIX := >

          %:
          >dh $@

          override_dh_auto_install:
          >install -D -m 755 qt_app/realme_t310_controller.py $(CURDIR)/debian/realme-t310-controller/usr/bin/realme-t310-controller
          >install -D -m 644 realme-t310-controller.desktop $(CURDIR)/debian/realme-t310-controller/usr/share/applications/realme-t310-controller.desktop
          >install -D -m 644 icons/realme-t310.png $(CURDIR)/debian/realme-t310-controller/usr/share/icons/hicolor/256x256/apps/realme-t310-controller.png
          EOF
          chmod +x debian/rules
          debuild -us -uc -b
          mv -v ../*.deb .

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deb-packages
          path: "*.deb"
          retention-days: 30

  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-dbus desktop-file-utils

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          AD=realme-t310-controller.AppDir
          mkdir -p $AD/usr/bin
          mkdir -p $AD/usr/share/applications
          mkdir -p $AD/usr/share/icons/hicolor/256x256/apps

          cp qt_app/realme_t310_controller.py $AD/usr/bin/
          cp realme-t310-controller.desktop $AD/usr/share/applications/realme-t310-controller.desktop
          cp realme-t310-controller.desktop $AD/realme-t310-controller.desktop
          cp icons/realme-t310.png $AD/usr/share/icons/hicolor/256x256/apps/realme-t310-controller.png
          cp icons/realme-t310.png $AD/realme-t310-controller.png
          ln -sf realme-t310-controller.png $AD/.DirIcon

          echo '#!/usr/bin/python3' | cat - $AD/usr/bin/realme_t310_controller.py > tmp && mv tmp $AD/usr/bin/realme-t310-controller
          chmod +x $AD/usr/bin/realme-t310-controller

          cat > $AD/AppRun << 'EOF'
          #!/bin/bash
          exec "$(dirname "$0")"/usr/bin/realme-t310-controller "$@"
          EOF
          chmod +x $AD/AppRun

          export APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64
          ./appimagetool-x86_64.AppImage $AD realme-t310-controller-0.0.1-x86_64.AppImage

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: appimage-packages
          path: "*.AppImage"
          retention-days: 30

  release:
    needs: [build-rpm, build-deb, build-appimage]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 0.0.1-rc
          prerelease: true
          files: |
            artifacts/rpm-packages/*.rpm
            artifacts/deb-packages/*.deb
            artifacts/appimage-packages/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
